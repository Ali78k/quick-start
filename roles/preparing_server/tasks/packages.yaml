---
- name: Update and upgrade apt packages
  ansible.builtin.apt:
    upgrade: no
    update_cache: yes
    cache_valid_time: 86400

- name: Install basic tools
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    force_apt_get: yes
    update_cache: yes
  loop: "{{ packages }}"

- name: Set hostname
  ansible.builtin.hostname:
    name: '{{ inventory_hostname }}'

- name: Fix /etc/hosts
  ansible.builtin.template:
    src: "hosts.j2"
    dest: "/etc/hosts"
