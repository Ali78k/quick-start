---
- name: install dependency
  ansible.builtin.apt:
    name: "{{item}}"
    state: present
    update_cache: yes
  loop:
    - apt-transport-https
    - ca-certificates
    - curl
    - gnupg-agent
    - software-properties-common

- name: give GPG key
  ansible.builtin.get_url:
    url: "{{ docker_ce.gpg_key if not docker_ce.use_mirror else docker_ce.gpg_key_mirror }}"
    dest: /tmp/docker.gpg
    mode: '0644'
  register: gpg_key_download

- name: dearmor GPG key
  ansible.builtin.apt_key:
    file: /tmp/docker.gpg
    state: present

- name: add docker repo
  ansible.builtin.apt_repository:
    repo:  "deb {{ docker_ce.deb_file if not docker_ce.use_mirror else docker_ce.deb_file_mirror }}/ {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes

- name: install docker
  ansible.builtin.apt:
    name: "{{item}}"
    state: latest
    update_cache: yes
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-compose-plugin

- name: start and enable docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes
